<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="曜见 AI 财富管理工作台" />
    <title>曜见 · AI 财富管理工作台</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      .app-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: #1f2328;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .app-boot-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        transform: translateY(-24px);
      }

      .app-boot-spinner {
        position: relative;
        width: 42px;
        height: 42px;
        border: 3px solid #e7e5ff;
        border-top-color: #5751ff;
        border-right-color: #8b84ff;
        border-radius: 50%;
        animation: app-boot-spin .85s linear infinite;
      }

      .app-boot-spinner::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #5751ff, #8b84ff);
        box-shadow: 0 3px 10px rgba(87, 81, 255, .2);
      }

      .app-boot-content strong {
        margin-top: 4px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: .01em;
      }

      .app-boot-content span {
        color: #8c8c8c;
        font-size: 13px;
      }

      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner { animation-duration: 1.8s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-screen" role="status" aria-live="polite" aria-label="正在加载 AI 财富管理工作台">
        <div class="app-boot-content">
          <div class="app-boot-spinner" aria-hidden="true"></div>
          <strong>AI 财富管理工作台</strong>
          <span>正在加载客户资产与风险信息…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
